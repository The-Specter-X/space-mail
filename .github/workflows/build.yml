name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build libgtk-3-dev \
            libxapp-dev libgmime-3.0-dev libsecret-1-dev libsqlite3-dev \
            libcurl4-openssl-dev libxml2-dev
      - name: Configure
        run: meson setup build
      - name: Compile
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
